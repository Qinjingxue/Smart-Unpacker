name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version label to use in build artifact filenames, for example v0.1.0. Leave empty to derive it from git."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.release_tag || 'artifact' }}
  cancel-in-progress: false

jobs:
  build-notes:
    name: Generate build notes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate notes from commits
        id: notes
        shell: bash
        env:
          IS_TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Remove stale local tag refs first; this matters when a release tag is
          # deleted and recreated at a different commit.
          git fetch --force --prune --tags

          target="${SHA}"
          current_tag=""
          if [ "${IS_TAG_REF}" = "true" ]; then
            current_tag="${REF_NAME}"
            target="$(git rev-list -n 1 "${current_tag}")"
          elif [ -n "${RELEASE_TAG_INPUT}" ]; then
            current_tag="${RELEASE_TAG_INPUT}"
          fi

          previous_tag=""
          if [ "${IS_TAG_REF}" = "true" ]; then
            previous_tag="$(git describe --tags --match 'v*' --exclude="${current_tag}" --abbrev=0 "${target}^" 2>/dev/null || true)"
          else
            previous_tag="$(git describe --tags --match 'v*' --abbrev=0 "${target}" 2>/dev/null || true)"
          fi

          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${target}"
            compare_label="${previous_tag}..${current_tag:-${REF_NAME}}"
          else
            range="${target}"
            compare_label="${current_tag:-${REF_NAME}}"
          fi

          {
            echo "# SunPack build notes"
            echo
            if [ -n "${current_tag}" ]; then
              echo "Build version: ${current_tag}"
            else
              echo "Build ref: ${REF_NAME}"
            fi
            echo "Commit: ${target}"
            if [ -n "${previous_tag}" ]; then
              echo "Changes since: ${previous_tag}"
            else
              echo "Changes since: initial history"
            fi
            echo
            echo "## Commits"
          } > build-notes.md

          commits="$(git log --format='- %s (%h)' "${range}")"
          if [ -n "${commits}" ]; then
            printf '%s\n' "${commits}" >> build-notes.md
          else
            echo "- No commits found in ${compare_label}." >> build-notes.md
          fi

          echo "previous_tag=${previous_tag}" >> "${GITHUB_OUTPUT}"

      - name: Upload build notes
        uses: actions/upload-artifact@v7
        with:
          name: sunpack-build-notes
          path: build-notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.arch }} lite
    needs: build-notes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            repair_system: lite
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python_version: "3.11"
          - arch: arm64
            repair_system: lite
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            python_arch: arm64
            python_version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add ${{ matrix.rust_target }}
          cargo --version
          rustc -Vv

      - name: Show toolchain architecture
        shell: pwsh
        run: |
          python -c "import platform, sys; print(sys.version); print(platform.machine())"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Prepare native/tool environment
        shell: pwsh
        run: |
          .\scripts\setup_windows_dev.ps1 -Arch ${{ matrix.arch }} -RepairSystem ${{ matrix.repair_system }}

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install innosetup --yes --no-progress
            } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            } else {
              throw "Neither Chocolatey nor winget is available to install Inno Setup."
            }
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup installation completed but ISCC.exe was not found."
          }
          Write-Host "Inno Setup compiler: $iscc"

      - name: Build Windows package
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
          GIT_EVENT_NAME: ${{ github.event_name }}
          GIT_REF_NAME: ${{ github.ref_name }}
          IS_TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $version = ""
          if ($env:GIT_EVENT_NAME -eq "workflow_dispatch" -and $env:RELEASE_TAG_INPUT) {
            $version = $env:RELEASE_TAG_INPUT.Trim()
          } elseif ($env:IS_TAG_REF -eq "true") {
            $version = $env:GIT_REF_NAME
          }
          if ($version -match '[\\/:*?"<>|]') {
            throw "Release version contains characters that are invalid in a Windows package filename: $version"
          }

          $buildArgs = @{
            SkipTests = $true
            NoPause = $true
            Arch = "${{ matrix.arch }}"
            RepairSystem = "${{ matrix.repair_system }}"
          }
          if ($version -ne "") {
            $buildArgs.Version = $version
          }
          .\scripts\build_windows.ps1 @buildArgs

      - name: Validate release package
        shell: pwsh
        run: |
          $archives = @(
            Get-ChildItem -LiteralPath "release" `
              -Filter "sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*.zip" `
              -File
          )
          $installers = @(
            Get-ChildItem -LiteralPath "release" `
              -Filter "sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*-setup.exe" `
              -File
          )
          if ($archives.Count -ne 1 -or $installers.Count -ne 1) {
            throw "Expected one portable archive and one installer; found $($archives.Count) archive(s) and $($installers.Count) installer(s)."
          }
          Write-Host "Portable archive: $($archives[0].FullName)"
          Write-Host "Windows installer: $($installers[0].FullName)"

      - name: Verify package architecture
        shell: pwsh
        run: |
          $packageRoot = "dist\sunpack-${{ matrix.arch }}-${{ matrix.repair_system }}"
          .\scripts\verify_windows_package_arch.ps1 -PackageRoot $packageRoot -Arch ${{ matrix.arch }}

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "release" `
            -Filter "sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*-setup.exe" `
            -File |
            Select-Object -First 1
          .\scripts\test_windows_installer.ps1 -InstallerPath $installer.FullName

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}
          path: |
            release/sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*.zip
            release/sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  acceptance:
    name: Acceptance Tests
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo --version
          rustc -Vv

      - name: Prepare acceptance environment
        shell: pwsh
        run: |
          .\scripts\setup_windows_dev.ps1 -Arch x64 -RepairSystem lite

      - name: Run acceptance tests
        shell: pwsh
        env:
          SUNPACK_REPAIR_SYSTEM: lite
        run: |
          .\run_acceptance_tests.ps1 -NoWait -SkipEnvironmentRefresh -StepTimeoutSeconds 900

  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build-notes
      - build
      - acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Download build notes
        uses: actions/download-artifact@v8
        with:
          name: sunpack-build-notes
          path: release-notes

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find artifacts -type f \( -name 'sunpack-windows-*.zip' -o -name 'sunpack-windows-*-setup.exe' \) | sort)
          if [ "${#packages[@]}" -ne 4 ]; then
            echo "Expected four lite release files (two portable archives and two installers), found ${#packages[@]}." >&2
            exit 1
          fi
          for package in x64-lite arm64-lite; do
            if ! printf '%s\n' "${packages[@]}" | grep -Eq "/sunpack-windows-${package}-.*\.zip$"; then
              echo "Missing ${package} portable archive." >&2
              exit 1
            fi
            if ! printf '%s\n' "${packages[@]}" | grep -Eq "/sunpack-windows-${package}-.*-setup\.exe$"; then
              echo "Missing ${package} Windows installer." >&2
              exit 1
            fi
          done

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --notes-file release-notes/build-notes.md
            gh release upload "${TAG_NAME}" "${packages[@]}" --clobber
          else
            release_args=(release create "${TAG_NAME}" "${packages[@]}" --title "${TAG_NAME}" --notes-file release-notes/build-notes.md --target "${RELEASE_TARGET}")
            gh "${release_args[@]}"
          fi
