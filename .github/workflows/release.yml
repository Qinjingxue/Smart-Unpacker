name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag/version to publish, for example v0.1.0. Leave empty to build artifacts only."
        required: false
        type: string
      publish_release:
        description: "Create or update a GitHub Release when release_tag is set."
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark a manually published release as a prerelease."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_tag || 'artifact' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} lite
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            repair_system: lite
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python_version: "3.11"
          - arch: arm64
            repair_system: lite
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            python_arch: arm64
            python_version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add ${{ matrix.rust_target }}
          cargo --version
          rustc -Vv

      - name: Show toolchain architecture
        shell: pwsh
        run: |
          python -c "import platform, sys; print(sys.version); print(platform.machine())"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Prepare native/tool environment
        shell: pwsh
        run: |
          .\scripts\setup_windows_dev.ps1 -IncludeBuildDeps -Arch ${{ matrix.arch }} -RepairSystem ${{ matrix.repair_system }}

      - name: Build Windows package
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          GIT_EVENT_NAME: ${{ github.event_name }}
          GIT_REF_NAME: ${{ github.ref_name }}
          IS_TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $version = ""
          if ($env:GIT_EVENT_NAME -eq "workflow_dispatch" -and $env:RELEASE_TAG_INPUT) {
            $version = $env:RELEASE_TAG_INPUT.Trim()
          } elseif ($env:IS_TAG_REF -eq "true") {
            $version = $env:GIT_REF_NAME
          }
          if ($version -match '[\\/:*?"<>|]') {
            throw "Release version contains characters that are invalid in a Windows package filename: $version"
          }

          $buildArgs = @{
            SkipTests = $true
            Arch = "${{ matrix.arch }}"
            RepairSystem = "${{ matrix.repair_system }}"
          }
          if ($version -ne "") {
            $buildArgs.Version = $version
          }
          .\scripts\build_windows.ps1 @buildArgs

      - name: Validate release package
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem -LiteralPath "release" `
              -Filter "sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*.zip" `
              -File
          )
          if ($packages.Count -ne 1) {
            throw "Expected exactly one ${{ matrix.arch }} ${{ matrix.repair_system }} release package, found $($packages.Count)."
          }
          Write-Host "Release package: $($packages[0].FullName)"

      - name: Verify package architecture
        shell: pwsh
        run: |
          $packageRoot = "dist\sunpack-${{ matrix.arch }}-${{ matrix.repair_system }}"
          .\scripts\verify_windows_package_arch.ps1 -PackageRoot $packageRoot -Arch ${{ matrix.arch }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}
          path: release/sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  acceptance:
    name: Acceptance Tests
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo --version
          rustc -Vv

      - name: Prepare acceptance environment
        shell: pwsh
        run: |
          .\scripts\setup_windows_dev.ps1 -IncludeBuildDeps -Arch x64 -RepairSystem lite

      - name: Run acceptance tests
        shell: pwsh
        run: |
          .\run_acceptance_tests.ps1 -NoWait -SkipEnvironmentRefresh -StepTimeoutSeconds 900

  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '') }}
    needs:
      - build
      - acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          RELEASE_TARGET: ${{ github.sha }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find artifacts -type f -name 'sunpack-windows-*.zip' | sort)
          if [ "${#packages[@]}" -ne 2 ]; then
            echo "Expected two lite release packages, found ${#packages[@]}." >&2
            exit 1
          fi
          for package in x64-lite arm64-lite; do
            if ! printf '%s\n' "${packages[@]}" | grep -q "/sunpack-windows-${package}-"; then
              echo "Missing ${package} release package." >&2
              exit 1
            fi
          done

          notes="Automated SunPack Windows build for ${TAG_NAME}."
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${packages[@]}" --clobber
          else
            release_args=(release create "${TAG_NAME}" "${packages[@]}" --title "${TAG_NAME}" --notes "${notes}" --target "${RELEASE_TARGET}")
            if [ "${PRERELEASE}" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi
