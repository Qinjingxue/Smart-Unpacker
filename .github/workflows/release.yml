name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag/version to publish, for example v0.1.0. Leave empty to build artifacts only."
        required: false
        type: string
      publish_release:
        description: "Create or update a GitHub Release when release_tag is set."
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark a manually published release as a prerelease."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_tag || 'artifact' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} lite
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            repair_system: lite
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            python_arch: x64
            python_version: "3.11"
          - arch: arm64
            repair_system: lite
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            python_arch: arm64
            python_version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add ${{ matrix.rust_target }}
          cargo --version
          rustc -Vv

      - name: Show toolchain architecture
        shell: pwsh
        run: |
          python -c "import platform, sys; print(sys.version); print(platform.machine())"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Prepare native/tool environment
        shell: pwsh
        run: |
          .\scripts\setup_windows_dev.ps1 -IncludeBuildDeps -Arch ${{ matrix.arch }} -RepairSystem ${{ matrix.repair_system }}

      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install innosetup --yes --no-progress
            } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
            } else {
              throw "Neither Chocolatey nor winget is available to install Inno Setup."
            }
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup installation completed but ISCC.exe was not found."
          }
          Write-Host "Inno Setup compiler: $iscc"

      - name: Build Windows package
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          GIT_EVENT_NAME: ${{ github.event_name }}
          GIT_REF_NAME: ${{ github.ref_name }}
          IS_TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $version = ""
          if ($env:GIT_EVENT_NAME -eq "workflow_dispatch" -and $env:RELEASE_TAG_INPUT) {
            $version = $env:RELEASE_TAG_INPUT.Trim()
          } elseif ($env:IS_TAG_REF -eq "true") {
            $version = $env:GIT_REF_NAME
          }
          if ($version -match '[\\/:*?"<>|]') {
            throw "Release version contains characters that are invalid in a Windows package filename: $version"
          }

          $buildArgs = @{
            SkipTests = $true
            Arch = "${{ matrix.arch }}"
            RepairSystem = "${{ matrix.repair_system }}"
          }
          if ($version -ne "") {
            $buildArgs.Version = $version
          }
          .\scripts\build_windows.ps1 @buildArgs

      - name: Validate release package
        shell: pwsh
        run: |
          $archives = @(
            Get-ChildItem -LiteralPath "release" `
              -Filter "sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*.zip" `
              -File
          )
          $installers = @(
            Get-ChildItem -LiteralPath "release" `
              -Filter "sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*-setup.exe" `
              -File
          )
          if ($archives.Count -ne 1 -or $installers.Count -ne 1) {
            throw "Expected one portable archive and one installer; found $($archives.Count) archive(s) and $($installers.Count) installer(s)."
          }
          Write-Host "Portable archive: $($archives[0].FullName)"
          Write-Host "Windows installer: $($installers[0].FullName)"

      - name: Verify package architecture
        shell: pwsh
        run: |
          $packageRoot = "dist\sunpack-${{ matrix.arch }}-${{ matrix.repair_system }}"
          .\scripts\verify_windows_package_arch.ps1 -PackageRoot $packageRoot -Arch ${{ matrix.arch }}

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "release" `
            -Filter "sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*-setup.exe" `
            -File |
            Select-Object -First 1
          .\scripts\test_windows_installer.ps1 -InstallerPath $installer.FullName

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}
          path: |
            release/sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*.zip
            release/sunpack-windows-${{ matrix.arch }}-${{ matrix.repair_system }}-*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  acceptance:
    name: Acceptance Tests
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo --version
          rustc -Vv

      - name: Prepare acceptance environment
        shell: pwsh
        run: |
          .\scripts\setup_windows_dev.ps1 -IncludeBuildDeps -Arch x64 -RepairSystem lite

      - name: Run acceptance tests
        shell: pwsh
        env:
          SUNPACK_REPAIR_SYSTEM: lite
        run: |
          .\run_acceptance_tests.ps1 -NoWait -SkipEnvironmentRefresh -StepTimeoutSeconds 900

  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '') }}
    needs:
      - build
      - acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          RELEASE_TARGET: ${{ github.sha }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find artifacts -type f \( -name 'sunpack-windows-*.zip' -o -name 'sunpack-windows-*-setup.exe' \) | sort)
          if [ "${#packages[@]}" -ne 4 ]; then
            echo "Expected four lite release files (two portable archives and two installers), found ${#packages[@]}." >&2
            exit 1
          fi
          for package in x64-lite arm64-lite; do
            if ! printf '%s\n' "${packages[@]}" | grep -Eq "/sunpack-windows-${package}-.*\.zip$"; then
              echo "Missing ${package} portable archive." >&2
              exit 1
            fi
            if ! printf '%s\n' "${packages[@]}" | grep -Eq "/sunpack-windows-${package}-.*-setup\.exe$"; then
              echo "Missing ${package} Windows installer." >&2
              exit 1
            fi
          done

          notes="Automated SunPack Windows build for ${TAG_NAME}."
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${packages[@]}" --clobber
          else
            release_args=(release create "${TAG_NAME}" "${packages[@]}" --title "${TAG_NAME}" --notes "${notes}" --target "${RELEASE_TARGET}")
            if [ "${PRERELEASE}" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi
